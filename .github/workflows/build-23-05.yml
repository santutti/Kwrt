name: Build MF286D Stable 23.05
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        run: sudo apt update && sudo apt install -y build-essential gawk wget python3 file

      #- name: Use Image Builder
        #run: |
          # 1. Download official Image Builder for 23.05.5
          #wget https://downloads.openwrt.org/releases/23.05.5/targets/ipq40xx/generic/openwrt-imagebuilder-23.05.5-ipq40xx-generic.Linux-x86_64.tar.xz
          #tar -J -xvf *.tar.xz
          #cd openwrt-imagebuilder-23.05.5-ipq40xx-generic.Linux-x86_64
          
          # 2. Inject your custom repos so the builder can find 4IceG packages
          #echo "src/gz eko1 https://dl.eko.one.pl/openwrt-23.05/packages/arm_cortex-a7_neon-vfpv4/eko1" >> repositories.conf
          #echo "src/gz IceG_repo https://github.com/4IceG/Modem-extras/raw/main/myrepo" >> repositories.conf
          #echo "src/gz openwrt-tailscale https://gunanovo.github.io/openwrt-tailscale/arm_cortex-a7_neon-vfpv4" >> repositories.conf
          
          # 3. Inject repos into FINAL router config so you can use 'opkg' later for small apps
          #mkdir -p files/etc/opkg
          #echo "src/gz eko1 https://dl.eko.one.pl/openwrt-23.05/packages/arm_cortex-a7_neon-vfpv4/eko1" >> files/etc/opkg/customfeeds.conf
          #echo "src/gz IceG_repo https://github.com/4IceG/Modem-extras/raw/main/myrepo" >> files/etc/opkg/customfeeds.conf
          # echo "src/gz openwrt-tailscale https://gunanovo.github.io/openwrt-tailscale/arm_cortex-a7_neon-vfpv4" >> files/etc/opkg/customfeeds.conf
      - name: Use Image Builder
        run: |
          wget https://downloads.openwrt.org/releases/23.05.5/targets/ipq40xx/generic/openwrt-imagebuilder-23.05.5-ipq40xx-generic.Linux-x86_64.tar.xz
          tar -J -xvf *.tar.xz
          cd openwrt-imagebuilder-23.05.5-ipq40xx-generic.Linux-x86_64
                
          # Use 'sed' to insert the custom repos at the very top of the list
          sed -i '1i src/gz eko1 https://dl.eko.one.pl/openwrt-23.05/packages/arm_cortex-a7_neon-vfpv4/eko1' repositories.conf
          sed -i '1i src/gz IceG_repo https://github.com/4IceG/Modem-extras/raw/main/myrepo' repositories.conf
          sed -i '1i src/gz openwrt_tailscale https://gunanovo.github.io/openwrt-tailscale/arm_cortex-a7_neon-vfpv4' repositories.conf
                
          # Clean build command
          make image PROFILE="zte_mf286d" PACKAGES="luci tailscale kmod-tun ca-bundle luci-proto-qmi uqmi usb-modeswitch block-mount kmod-usb-storage kmod-fs-exfat kmod-fs-vfat luci-app-ksmbd" FILES="files" IGNORE_SIGNATURE=1

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: MF286D-Stable-23.05
          path: openwrt-imagebuilder-*/bin/targets/ipq40xx/generic/*-sysupgrade.bin
